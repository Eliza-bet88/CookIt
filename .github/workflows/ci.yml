name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Compose
        run: docker compose build

      - name: Run Docker Compose
        run: docker compose up

      - name: Stop Docker Compose
        run: docker compose down